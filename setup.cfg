[metadata]
name = local-image-search
version = 0.1.0
description = Local-first image archive indexer and search tool
long_description = file: docs/requirements.md
long_description_content_type = text/markdown

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    pillow>=10.0
    rich>=13.0
    typer>=0.12
    fastapi>=0.115
    uvicorn[standard]>=0.30
    python-multipart>=0.0.9
    numpy>=1.26

[options.entry_points]
console_scripts =
    local-image-search = local_image_search.cli:app

[options.package_data]
local_image_search =
    web/*.html
    web/static/*.css
    web/static/*.js
