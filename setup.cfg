[metadata]
name = local-image-search
version = 0.1.0
description = Local-first image archive indexer and search tool
long_description = file: docs/requirements.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pillow>=10.0
    rich>=13.0
    typer>=0.12

[options.entry_points]
console_scripts =
    local-image-search = local_image_search.cli:app
